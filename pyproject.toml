[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mads-political-bias"
version = "2.0.0"
description = "Content-only political bias detection with conditional multi-agent debate"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MADS authors" }]
dependencies = []

[project.optional-dependencies]
paper = ["sentence-transformers>=3.0,<6"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
mads = "mads.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
